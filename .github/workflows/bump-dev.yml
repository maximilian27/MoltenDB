name: Auto-Bump Beta Version

# Trigger when code is pushed or merged into the dev branch
on:
  push:
    branches:
      - develop

jobs:
  bump-version:
    # THE SHIELD: This prevents the infinite loop. It tells GitHub to ignore commits made by this bot.
    if: "!startsWith(github.event.head_commit.message, 'chore: bump beta version')"
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to push the new Cargo.toml back to the repo

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          # Fetch the full history so we can push back
          fetch-depth: 0

      - name: Configure Git Bot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Parse and Bump All Crate Versions
        run: |
          # Read the current version from moltendb-core (source of truth)
          CURRENT_VERSION=$(grep -m 1 '^version = ' moltendb-core/Cargo.toml | tr -d ' "' | sed 's/version=//')
          echo "Current version: $CURRENT_VERSION"

          # Use Regex to split the string (e.g., "0.2.0-beta." and "3")
          if [[ $CURRENT_VERSION =~ (.*-beta\.)([0-9]+) ]]; then
            BASE="${BASH_REMATCH[1]}"
            NUM="${BASH_REMATCH[2]}"

            # Increment the number
            NEW_NUM=$((NUM + 1))
            NEW_VERSION="${BASE}${NEW_NUM}"

            echo "Bumping to: $NEW_VERSION"

            # Update version in all three crate Cargo.toml files
            for CRATE_TOML in moltendb-core/Cargo.toml moltendb-server/Cargo.toml moltendb-auth/Cargo.toml; do
              sed -i -e "s/^version = \"$CURRENT_VERSION\"/version = \"$NEW_VERSION\"/" "$CRATE_TOML"
              echo "Updated $CRATE_TOML"
            done

            # Update internal dependency version references
            sed -i "s/moltendb-core = { version = \"$CURRENT_VERSION\"/moltendb-core = { version = \"$NEW_VERSION\"/g" moltendb-auth/Cargo.toml
            sed -i "s/moltendb-core = { version = \"$CURRENT_VERSION\"/moltendb-core = { version = \"$NEW_VERSION\"/g" moltendb-server/Cargo.toml
            sed -i "s/moltendb-auth = { version = \"$CURRENT_VERSION\"/moltendb-auth = { version = \"$NEW_VERSION\"/g" moltendb-server/Cargo.toml

            # Sync Cargo.lock — update all three workspace members
            cargo update -p moltendb-core
            cargo update -p moltendb-server
            cargo update -p moltendb-auth

            # Commit and push all changed files back to the dev branch
            git add moltendb-core/Cargo.toml moltendb-server/Cargo.toml moltendb-auth/Cargo.toml Cargo.lock
            git commit -m "chore: bump beta version to $NEW_VERSION [skip ci]"
            git push
          else
            echo "Current version ($CURRENT_VERSION) does not match the '-beta.X' pattern."
            echo "Skipping version bump."
            exit 0
          fi
