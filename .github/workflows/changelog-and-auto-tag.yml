name: Changelog & Tag Pipeline

# Trigger ONLY when code is pushed or merged into the master branch
on:
  push:
    branches:
      - master

jobs:
  changelog-and-tag:
    # THE SHIELD: Prevent loops if the changelog commit itself triggers this
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.REPO_PAT }}

          # 1. MOVED UP: Extract the version FIRST
      - name: Extract Version from Cargo.toml
        id: extract
        run: |
          VERSION=$(grep -m 1 '^version = ' Cargo.toml | tr -d ' "' | sed 's/version=//')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Detected version: $VERSION"

      - name: Generate Changelog
        uses: TriPSs/conventional-changelog-action@v5
        with:
          github-token: ${{ secrets.REPO_PAT }}
          output-file: "CHANGELOG.md"
          skip-version-file: "true"
          skip-tag: "true"
          # TELL IT EXACTLY WHAT VERSION TO USE
          skip-bump: "true"
          fallback-version: ${{ env.VERSION }}
          # CORRECTED PARAMETER NAME
          git-message: "chore(release): update changelog v${{ env.VERSION }} [skip ci]"


      - name: Check if Tag Already Exists
        id: check_tag
        run: |
          # Make sure we have the latest commits locally (including the new changelog commit)
          git pull origin master
          
          if git rev-parse "v${{ env.VERSION }}" >/dev/null 2>&1; then
            echo "Tag v${{ env.VERSION }} already exists. Skipping tag creation."
            echo "EXISTS=true" >> $GITHUB_ENV
          else
            echo "Tag v${{ env.VERSION }} is new."
            echo "EXISTS=false" >> $GITHUB_ENV
          fi

      - name: Create and Push Tag
        if: env.EXISTS == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          TAG_NAME="v${{ env.VERSION }}"
          echo "Cutting new release tag: $TAG_NAME"
          
          # Tag the current HEAD (which now includes the CHANGELOG.md update)
          git tag $TAG_NAME
          git push origin $TAG_NAME