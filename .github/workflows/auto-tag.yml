name: Auto-Tag on Master

# Trigger ONLY when code is pushed or merged into the master branch
on:
  push:
    branches:
      - master # (Change to 'main' if your default branch is main)

jobs:
  create-tag:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # We need the full git history to check for existing tags
          # CRITICAL: We use a custom PAT here so the tag push triggers the Release workflow
          token: ${{ secrets.REPO_PAT }}

      - name: Extract Version from Cargo.toml
        id: extract
        run: |
          # Read the raw version string from Cargo.toml
          VERSION=$(grep -m 1 '^version = ' Cargo.toml | tr -d ' "' | sed 's/version=//')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Detected version: $VERSION"

      - name: Check if Tag Already Exists
        id: check_tag
        run: |
          # If we merge to master but didn't bump the version, we don't want to crash.
          # This checks if the tag is already in the repository.
          if git rev-parse "v${{ env.VERSION }}" >/dev/null 2>&1; then
            echo "Tag v${{ env.VERSION }} already exists. Skipping tag creation."
            echo "EXISTS=true" >> $GITHUB_ENV
          else
            echo "Tag v${{ env.VERSION }} is new."
            echo "EXISTS=false" >> $GITHUB_ENV
          fi

      - name: Create and Push Tag
        if: env.EXISTS == 'false'
        run: |
          # Use the official bot identity for the tag metadata
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          TAG_NAME="v${{ env.VERSION }}"
          echo "Cutting new release tag: $TAG_NAME"
          
          git tag $TAG_NAME
          git push origin $TAG_NAME