name: Build WASM & Sync to Web Repo

# Trigger exactly when your auto-tagger creates a new 'v*' release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MoltenDB Core (Rust)
        uses: actions/checkout@v4
        with:
          path: core-repo

      - name: Checkout Web Monorepo (TS/JS)
        uses: actions/checkout@v4
        with:
          repository: maximilian27/moltendb-web
          path: web-repo
          token: ${{ secrets.REPO_PAT }} # CRITICAL: Authorizes the push to the second repo

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Hot-Swap Release Profile for WASM Optimization
        working-directory: ./core-repo
        run: |
          echo "Safely overwriting profile.release using inline Python..."
          python3 -c '
          with open("Cargo.toml", "r") as f:
              content = f.read()
          
          # Split the file to locate your exact release profile block
          if "[profile.release]" in content:
              before, after = content.split("[profile.release]", 1)
              # If there are other profiles below it, isolate just the release block
              if "\n[" in after:
                  target_block, rest = after.split("\n[", 1)
                  rest = "\n[" + rest
              else:
                  target_block, rest = after, ""
          
              # Construct the new clean release profile matching your "z" specs
              new_release = "\nopt-level = \"z\"\nlto = true\ncodegen-units = 1\nstrip = true\npanic = \"abort\"\n"
          
              # Reassemble the file
              content = before + "[profile.release]" + new_release + rest
          
          with open("Cargo.toml", "w") as f:
              f.write(content)
          '
          
          echo "Verification of temporary Cargo.toml structure:"
          cat Cargo.toml | grep -A 6 "\[profile.release\]"

      - name: Build WASM
        working-directory: ./core-repo
        run: wasm-pack build moltendb-wasm --target web

      - name: Surgical Artifact Sync
        run: |
          # Define exact paths to prevent typos
          SRC_PKG="core-repo/moltendb-wasm/pkg"
          DEST_CORE="web-repo/packages/core"
          DEST_WASM="$DEST_CORE/src/wasm"
          
          echo "Syncing artifacts to $DEST_WASM..."
          
          # 1. Ensure the dist directory exists
          mkdir -p "$DEST_WASM"
          
          # 2. Copy exactly the 4 code artifacts into /packages/core/dist/
          cp "$SRC_PKG/moltendb_core.d.ts" "$DEST_WASM/"
          cp "$SRC_PKG/moltendb_core.js" "$DEST_WASM/"
          cp "$SRC_PKG/moltendb_core_bg.wasm" "$DEST_WASM/"
          cp "$SRC_PKG/moltendb_core_bg.wasm.d.ts" "$DEST_WASM/"
          

      - name: Commit and Push to Web Monorepo
        working-directory: ./web-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add .
          
          # Prevent the workflow from crashing if the files haven't actually changed
          if git diff --staged --quiet; then
            echo "No WASM changes detected. Skipping push."
          else
            git commit -m "chore: sync WASM engine artifacts & bump version to ${{ github.ref_name }}"
          
            git push origin develop 
          fi