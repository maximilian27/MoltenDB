name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      # This matrix spins up three separate virtual machines in parallel
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: moltendb
            asset_name: moltendb-linux-amd64
          - os: macos-latest
            artifact_name: moltendb
            asset_name: moltendb-macos-amd64
          - os: windows-latest
            artifact_name: moltendb.exe
            asset_name: moltendb-windows-amd64.exe

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Release Binary
        run: cargo build --release --package moltendb-server

      - name: Rename Binary (Linux & macOS)
        if: matrix.os != 'windows-latest'
        run: mv target/release/${{ matrix.artifact_name }} ./${{ matrix.asset_name }}

      - name: Rename Binary (Windows)
        if: matrix.os == 'windows-latest'
        run: move target\release\${{ matrix.artifact_name }} .\${{ matrix.asset_name }}

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./${{ matrix.asset_name }}
            tests/requests_1_reads.http
            tests/requests_2_joins.http
            tests/requests_3_mutations.http
            tests/requests_4_security.http
            tests/requests_5_schemas.http
            tests/requests_6_auth_telemetry.http
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}