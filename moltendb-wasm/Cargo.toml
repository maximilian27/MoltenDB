[package]
name = "moltendb-wasm"
version = "0.2.0-beta.4"
edition = "2024"
authors = ["Maximilian Both <maximilian.both27@outlook.com>"]
description = "MoltenDB WASM adapter — exposes the core engine to JavaScript via wasm-bindgen."
license-file = "LICENSE.md"
repository = "https://github.com/maximilian27/MoltenDB"

[lib]
# Keep generated JS/WASM filenames identical to the previous moltendb-core build
# so the web repo and CI sync workflow need zero changes.
name = "moltendb_core"
crate-type = ["cdylib"]

[dependencies]
moltendb-core = { version = "0.2.0-beta.4", path = "../moltendb-core" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
serde_json = "1.0.149"
getrandom = { version = "0.2", features = ["js"] }
console_error_panic_hook = "0.1"
uuid = { version = "1", features = ["v7", "serde", "js"] }

[dependencies.web-sys]
version = "0.3"
features = [
    "console",
    "Window",
    "MessageEvent",
    "WorkerGlobalScope",
    "WorkerNavigator",
    "StorageManager",
    "FileSystemDirectoryHandle",
    "FileSystemFileHandle",
    "FileSystemSyncAccessHandle",
    "FileSystemGetFileOptions",
    "FileSystemReadWriteOptions"
]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
