[package]
name = "moltendb-wasm"
version = "1.0.0-rc12"
edition = "2024"
authors = ["Maximilian Both <admin@moltendb.dev>"]
description = "MoltenDB WASM adapter — exposes the core engine to JavaScript via wasm-bindgen."
license = "Apache-2.0"
repository = "https://github.com/maximilian27/MoltenDB"

[lib]
# Keep generated JS/WASM filenames identical to the previous moltendb-core build
# so the web repo and CI sync workflow need zero changes.
name = "moltendb_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
moltendb-core = { version = "1.0.0-rc12", path = "../moltendb-core", default-features = false }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = [
    "console",
    "Window",
    "MessageEvent",
    "WorkerGlobalScope",
    "WorkerNavigator",
    "StorageManager",
    "FileSystemDirectoryHandle",
    "FileSystemFileHandle",
    "FileSystemSyncAccessHandle",
    "FileSystemGetFileOptions",
    "FileSystemReadWriteOptions"
]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[package.metadata.wasm-pack.profile.wasm]
wasm-opt = false
